name: build

# Every push and pull request builds on all three systems and keeps the packaged game as an
# artifact. Pushing a tag that starts with "v" (for example v1.0.0) also publishes the
# packages as a GitHub Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Show toolchain
        shell: bash
        run: |
          cmake --version | head -n 1
          if [ "$RUNNER_OS" = "Windows" ]; then gcc --version | head -n 1; ninja --version; fi

      # Windows is built with MinGW and linked statically, like on the developer's machine:
      # one exe with no extra runtime to install
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Configure (Linux, macOS)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="$GITHUB_REF_NAME"; else VERSION="${GITHUB_SHA::7}"; fi
          NAME="topple-$VERSION-${{ matrix.name }}"
          cmake --install build --config Release --prefix "dist/$NAME" --component game
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -E tar cf "$NAME.zip" --format=zip "$NAME"      # zip: what Windows users expect
          else
            cmake -E tar czf "$NAME.tar.gz" "$NAME"               # tar.gz keeps the executable bit
          fi
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: topple-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: topple-*
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
